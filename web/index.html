<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go execution paths</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; display: flex; height: 100vh; font: 14px system-ui, sans-serif; }
  #side { width: 300px; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
  #side .bar { display: flex; gap: 4px; padding: 8px; }
  #filter { flex: 1; padding: 4px 6px; }
  #tree { flex: 1; overflow: auto; padding: 0 8px 8px; font: 13px ui-monospace, monospace; }
  #tree details { padding-left: 12px; }
  #tree > details, #tree > a { margin-left: -12px; }
  #tree summary { cursor: pointer; white-space: nowrap; }
  #tree a { display: block; padding-left: 26px; color: inherit; text-decoration: none; white-space: nowrap; }
  #tree a:hover { background: #eef; }
  #tree a.sel { background: #dde4ff; }
  #main { flex: 1; overflow: auto; padding: 12px 16px; position: relative; }
  a.link { color: #555; cursor: pointer; text-decoration: underline dotted; }
  .muted { color: #888; }

  .box { --c: #8c959f; border: 1px solid #d0d7de; border-left: 3px solid var(--c); border-radius: 4px; background: #fff; }
  .box.d1 { --c: #0969da; } .box.d2 { --c: #8250df; } .box.d3 { --c: #bf3989; }
  .box.d4 { --c: #bc4c00; } .box.d5 { --c: #1a7f37; }
  .box header { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; background: #f6f8fa; border-bottom: 1px solid #d0d7de; font: 12px ui-monospace, monospace; }
  .box header b { font-size: 13px; }
  .box header .spacer { flex: 1; }
  .nest { margin: 2px 8px 6px 2.5em; }

  .code { padding: 4px 0; font: 13px/1.45 ui-monospace, monospace; overflow-x: auto; }
  .code > .line { padding-right: 8px; white-space: pre; }
  .code .mk { display: inline-block; width: 1.4em; text-align: center; color: #0969da; cursor: pointer; user-select: none; }
  .code .mk:empty { cursor: auto; }
  .code .mk.warn { color: #bbb; }
  .code .ln { display: inline-block; width: 3.5em; padding-right: 1em; text-align: right; color: #aaa; user-select: none; }
  .code .fn { cursor: pointer; }
  .code .fn:hover { background: #eef3ff; }
  .code .call { background: #fff3b0; }
  .code .gap { color: #777; background: #f6f8fa; font-style: italic; cursor: pointer; }
  .code .gap:hover { background: #eef3ff; }
  .badge { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 8px; background: #e4e8ee; color: #555; font-size: 11px; }

  .popover { position: absolute; z-index: 10; max-height: 50vh; overflow: auto; min-width: 300px; max-width: 520px; padding: 4px; background: #fff; border: 1px solid #bbb; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .popover button { display: block; width: 100%; padding: 3px 6px; border: 0; background: none; text-align: left; font: 12px ui-monospace, monospace; cursor: pointer; }
  .popover button:hover { background: #eef; }
  .popover .muted { padding: 3px 6px; font-size: 12px; }
  .popover button .muted { padding: 0; }
  .popover .warn { padding: 4px 6px; font-size: 12px; color: #6b5300; background: #fff8c5; border-radius: 3px; margin: 2px 0; }
</style>
</head>
<body>
<nav id="side">
  <div class="bar">
    <input id="filter" placeholder="Filter files…" autofocus>
    <button id="reload" title="Reload packages from disk">↻</button>
  </div>
  <div id="tree"></div>
</nav>
<main id="main"><p class="muted">Pick a file on the left. Click a function definition to see its callers, or ▸ next to a call to expand it inline.</p></main>
<script>
const $ = (s) => document.querySelector(s);
const main = $('#main');
const esc = (s) => s.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
const enc = encodeURIComponent;

let files = [];
let current = null; // the open file: {file, lines, funcs, calls: Map<line, [{fid, call}]>}
// The trace is a tree of function boxes. Each node is a function body; its
// children are callee bodies expanded inline under a call line. Choosing a
// caller wraps the tree: the caller becomes the new root. null while showing
// a whole file.
let root = null;
const nodes = new Map(); // uid -> node
let nextUID = 1;
let popover = null;

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function groupByLine(calls) {
  const m = new Map();
  for (const c of calls) {
    if (!m.has(c.line)) m.set(c.line, []);
    m.get(c.line).push(c);
  }
  return m;
}

// ---- file tree ----

async function loadTree() {
  files = await getJSON('/api/tree');
  renderTree();
}

function renderTree() {
  const q = $('#filter').value.toLowerCase();
  if (q) {
    $('#tree').innerHTML = files.filter((p) => p.toLowerCase().includes(q))
      .map((p) => `<a href="#${enc(p)}" data-file="${esc(p)}">${esc(p)}</a>`).join('');
  } else {
    const tree = { dirs: {}, files: [] };
    for (const p of files) {
      let node = tree;
      for (const d of p.split('/').slice(0, -1)) node = node.dirs[d] ??= { dirs: {}, files: [] };
      node.files.push(p);
    }
    $('#tree').innerHTML = treeHTML(tree, '');
  }
  if (current) markTree(current.file);
}

function treeHTML(node, prefix) {
  let html = '';
  for (const d of Object.keys(node.dirs).sort()) {
    const path = prefix + d + '/';
    html += `<details data-dir="${esc(path)}"><summary>${esc(d)}</summary>${treeHTML(node.dirs[d], path)}</details>`;
  }
  for (const p of node.files) {
    html += `<a href="#${enc(p)}" data-file="${esc(p)}">${esc(p.split('/').pop())}</a>`;
  }
  return html;
}

function markTree(file) {
  for (const a of $('#tree').querySelectorAll('a')) a.classList.toggle('sel', a.dataset.file === file);
  for (const d of $('#tree').querySelectorAll('details')) if (file.startsWith(d.dataset.dir)) d.open = true;
}

$('#tree').onclick = (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  openFile(a.dataset.file);
};

// ---- rendering helpers ----

// marker returns the gutter marker for a line's calls: ▸ expandable, ▾ expanded,
// ▹ (grey) only calls that can't be expanded.
function marker(calls, expanded) {
  if (!calls?.length) return '';
  if (expanded) return { glyph: '▾', cls: '', title: 'Collapse' };
  if (calls.some((c) => c.kind === 'static')) return { glyph: '▸', cls: '', title: 'Expand call inline' };
  return { glyph: '▹', cls: 'warn', title: "Can't expand: the target is decided at run time" };
}

// lineHTML renders one source line. opts: fn ({id, callers, uid}) makes it a
// clickable function definition; mk ({glyph, cls, title}) adds a call marker
// with data attributes in mkAttrs; cls adds classes.
function lineHTML(n, html, opts = {}) {
  const { fn, mk, mkAttrs = '', cls = '' } = opts;
  const fnAttrs = fn ? ` data-fn="${esc(fn.id)}"${fn.uid ? ` data-uid="${fn.uid}"` : ''}` : '';
  const badge = fn ? `<span class="badge" title="callers">${fn.callers}</span>` : '';
  const gutter = mk
    ? `<span class="mk ${mk.cls}" data-line="${n}"${mkAttrs} title="${esc(mk.title)}">${mk.glyph}</span>`
    : '<span class="mk"></span>';
  return `<div class="line ${cls}${fn ? ' fn' : ''}"${fnAttrs} data-n="${n}">${gutter}<span class="ln">${n}</span>${html}${badge}</div>`;
}

// ---- whole-file view ----

async function openFile(file, line) {
  closePopover();
  const d = await getJSON('/api/file?file=' + enc(file));
  const calls = new Map();
  for (const f of d.funcs) {
    for (const c of f.calls) {
      if (!calls.has(c.line)) calls.set(c.line, []);
      calls.get(c.line).push({ fid: f.id, call: c });
    }
  }
  current = { file, ...d, calls };
  root = null;
  history.replaceState(null, '', '#' + enc(file));
  markTree(file);

  const byLine = new Map(d.funcs.map((f) => [f.start, f]));
  main.innerHTML = `<section class="box"><header><b>${esc(file)}</b></header><div class="code chroma">` +
    d.lines.map((l, i) => {
      const n = i + 1, f = byLine.get(n), lineCalls = calls.get(n)?.map((x) => x.call);
      return lineHTML(n, l, { fn: f && { id: f.id, callers: f.callers }, mk: marker(lineCalls, false) });
    }).join('') + '</div></section>';

  const target = line && main.querySelector(`.line[data-n="${line}"]`);
  if (target) target.scrollIntoView({ block: 'center' });
  else main.scrollTop = 0;
}

// ---- trace view ----

async function loadNode(id) {
  const { func, callers, calls } = await getJSON('/api/func?id=' + enc(id));
  const { from, lines } = await getJSON(`/api/lines?file=${enc(func.file)}&from=${func.start}&to=${func.end}`);
  const node = {
    uid: nextUID++, func, callers, calls: groupByLine(calls), from, lines,
    children: new Map(), // "line:col" -> node
    parent: null, key: null,
    restFrom: null, restOpen: false, // lines after restFrom are collapsed (set when wrapping)
    wrapped: null, // key of the child this node was wrapped around, if any
  };
  nodes.set(node.uid, node);
  return node;
}

const callKey = (c) => `${c.line}:${c.col}`;

function attach(parent, child, call) {
  child.parent = parent;
  child.key = callKey(call);
  parent.children.set(child.key, child);
}

async function openTrace(fid, call) {
  closePopover();
  root = await loadNode(fid);
  if (call) attach(root, await loadNode(call.id), call);
  renderTrace();
  main.querySelector('.nest')?.scrollIntoView({ block: 'nearest' });
}

async function expand(node, call) {
  closePopover();
  attach(node, await loadNode(call.id), call);
  renderTrace();
}

function collapse(node, key) {
  closePopover();
  node.children.delete(key);
  if (node.wrapped === key) node.wrapped = node.restFrom = null;
  renderTrace();
}

// wrap makes the caller (call.caller) the new root, with node expanded inline
// at the call site. Boxes outside node are dropped.
async function wrap(node, call) {
  closePopover();
  const caller = await loadNode(call.caller);
  node.parent?.children.delete(node.key);
  attach(caller, node, call);
  caller.restFrom = call.line;
  caller.wrapped = node.key;
  root = caller;
  renderTrace();
  main.scrollTop = 0;
}

function unwrap() {
  const child = root.children.get(root.wrapped);
  child.parent = child.key = null;
  root = child;
  renderTrace();
}

function renderTrace() {
  main.innerHTML = boxHTML(root, 0);
}

function boxHTML(node, depth) {
  const f = node.func;
  let h = `<section class="box d${depth % 6}"><header><b>${esc(f.name)}</b>` +
    `<a class="link" data-open="${esc(f.file)}" data-line="${f.start}">${esc(f.file)}:${f.start}</a><span class="spacer"></span>`;
  if (node === root) {
    if (node.wrapped) h += '<button data-unwrap title="Remove this caller">×</button>';
    if (current) h += `<button data-open="${esc(current.file)}">← ${esc(current.file.split('/').pop())}</button>`;
  } else {
    h += `<button data-collapse="${node.parent.uid}" data-key="${node.key}" title="Collapse">×</button>`;
  }
  h += '</header><div class="code chroma">';

  const kidsByLine = new Map();
  for (const [key, kid] of node.children) {
    const [line, col] = key.split(':').map(Number);
    if (!kidsByLine.has(line)) kidsByLine.set(line, []);
    kidsByLine.get(line).push([col, kid]);
  }
  for (let j = 0; j < node.lines.length; j++) {
    const n = node.from + j;
    if (node.restFrom && !node.restOpen && n > node.restFrom) {
      const left = node.lines.length - j;
      h += `<div class="line gap" data-rest="${node.uid}"><span class="mk"></span><span class="ln"></span>` +
        `   ⋯ rest of ${esc(f.name)} after the call (${left} line${left > 1 ? 's' : ''})</div>`;
      break;
    }
    const kids = (kidsByLine.get(n) ?? []).sort((a, b) => a[0] - b[0]);
    h += lineHTML(n, node.lines[j], {
      fn: n === f.start && { id: f.id, callers: node.callers.length, uid: node.uid },
      mk: marker(node.calls.get(n), kids.length > 0),
      mkAttrs: ` data-uid="${node.uid}"`,
      cls: kids.length ? 'call' : '',
    });
    for (const [, kid] of kids) h += `<div class="nest">${boxHTML(kid, depth + 1)}</div>`;
  }
  return h + '</div></section>';
}

// ---- popovers ----

function showPopover(anchor, html, onclick) {
  closePopover();
  popover = document.createElement('div');
  popover.className = 'popover';
  popover.innerHTML = html;
  const ar = anchor.getBoundingClientRect(), mr = main.getBoundingClientRect();
  popover.style.top = `${ar.bottom - mr.top + main.scrollTop}px`;
  popover.style.left = `${ar.left - mr.left + main.scrollLeft + 24}px`;
  popover.onclick = (e) => {
    const b = e.target.closest('button');
    if (b) onclick(b);
  };
  main.appendChild(popover);
}

function closePopover() {
  popover?.remove();
  popover = null;
}

function cantExpand(c) {
  if (c.kind === 'interface') {
    return `<div class="warn">⚠ <b>${esc(c.name)}</b> is an interface method. Which implementation runs is decided at run time, so there's no single body to expand.</div>`;
  }
  return `<div class="warn">⚠ <b>${esc(c.name)}(…)</b> calls a function value. Its target is decided at run time, so it can't be expanded.</div>`;
}

// onMarker handles a click on a line's call marker, in a trace box (node) or
// the file view (node null). A single expandable call toggles directly; other
// cases show a popover with each call and warnings for ones that can't expand.
function onMarker(mk, node) {
  const line = Number(mk.dataset.line);
  const calls = node ? node.calls.get(line) : current.calls.get(line).map((x) => x.call);
  const fid = node ? null : current.calls.get(line)[0].fid;
  const act = (c) => {
    if (!node) return openTrace(fid, c);
    if (node.children.has(callKey(c))) return collapse(node, callKey(c));
    return expand(node, c);
  };
  if (calls.length === 1 && calls[0].kind === 'static') return act(calls[0]);

  const html = calls.map((c, i) => c.kind !== 'static' ? cantExpand(c)
    : `<button data-i="${i}">${node?.children.has(callKey(c)) ? '▾ collapse' : '▸'} ${esc(c.name)}</button>`).join('');
  showPopover(mk, html, (b) => act(calls[b.dataset.i]));
}

// onFuncLine shows a function's callers; choosing one wraps the function in it.
async function onFuncLine(line) {
  const node = line.dataset.uid ? nodes.get(Number(line.dataset.uid)) : null;
  const callers = node ? node.callers : (await getJSON('/api/func?id=' + enc(line.dataset.fn))).callers;
  let html = callers.length
    ? `<div class="muted">Called by (${callers.length}):</div>` +
      callers.map((c, i) => `<button data-i="${i}">${esc(c.callerName)} <span class="muted">${esc(c.file)}:${c.line}</span></button>`).join('')
    : '<div class="muted">No static callers.</div>';
  if (node && node !== root && callers.length) html += '<div class="muted">Choosing a caller replaces the boxes around this one.</div>';
  showPopover(line, html, async (b) => {
    const call = callers[b.dataset.i];
    wrap(node ?? await loadNode(line.dataset.fn), call);
  });
}

// ---- events ----

main.onclick = (e) => {
  if (popover?.contains(e.target)) return;
  const t = e.target;
  const open = t.closest('[data-open]');
  if (open) return openFile(open.dataset.open, open.dataset.line);
  if (t.closest('[data-unwrap]')) return unwrap();
  const col = t.closest('[data-collapse]');
  if (col) return collapse(nodes.get(Number(col.dataset.collapse)), col.dataset.key);
  const rest = t.closest('[data-rest]');
  if (rest) { nodes.get(Number(rest.dataset.rest)).restOpen = true; return renderTrace(); }
  const mk = t.closest('.mk[data-line]');
  if (mk) return onMarker(mk, mk.dataset.uid ? nodes.get(Number(mk.dataset.uid)) : null);
  const fn = t.closest('.fn');
  if (fn && !window.getSelection().toString()) return onFuncLine(fn);
  closePopover();
};
document.onkeydown = (e) => { if (e.key === 'Escape') closePopover(); };
document.addEventListener('mousedown', (e) => {
  if (popover && !popover.contains(e.target) && !main.contains(e.target)) closePopover();
});

$('#filter').oninput = renderTree;
$('#reload').onclick = async () => {
  await getJSON('/api/reload', { method: 'POST' });
  await loadTree();
  if (current && files.includes(current.file)) openFile(current.file);
};

loadTree().then(() => {
  const file = decodeURIComponent(location.hash.slice(1));
  if (files.includes(file)) openFile(file);
});
</script>
</body>
</html>
